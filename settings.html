<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Clock settings</title>
    <link rel="stylesheet" href="settings-page.css" />
  </head>
  <body>
    <h1>Clock settings</h1>

    <section>
      <h2>Opacity</h2>
      <div class="slider-row">
        <input id="opacity" type="range" min="10" max="100" step="5" />
        <output id="opacity-value"></output>
      </div>
    </section>

    <section>
      <h2>Size</h2>
      <div class="slider-row">
        <input id="width" type="range" min="66" max="490" step="1" />
        <output id="width-value"></output>
      </div>
      <p class="hint">You can also drag the edges of the clock itself.</p>
    </section>

    <section>
      <h2>Position</h2>
      <div class="corner-grid">
        <button data-corner="top-left">Top left</button>
        <button data-corner="top-right">Top right</button>
        <button data-corner="bottom-left">Bottom left</button>
        <button data-corner="bottom-right">Bottom right</button>
      </div>
      <p class="hint">Or just drag the clock anywhere. It remembers where you left it.</p>
    </section>

    <script src="settings-page.js"></script>
  </body>
</html>

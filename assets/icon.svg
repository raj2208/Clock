<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: a dark rounded square (macOS leaves a margin around icons),
       with a clock face showing 10:10 and a thin red second hand. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d33"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)"/>

  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10"/>

  <g stroke="#f2f2f4" stroke-linecap="round">
    <line x1="512" y1="240" x2="512" y2="300" stroke-width="26" transform="rotate(0 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(30 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(60 512 512)"/>
    <line x1="512" y1="240" x2="512" y2="300" stroke-width="26" transform="rotate(90 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(120 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(150 512 512)"/>
    <line x1="512" y1="240" x2="512" y2="300" stroke-width="26" transform="rotate(180 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(210 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(240 512 512)"/>
    <line x1="512" y1="240" x2="512" y2="300" stroke-width="26" transform="rotate(270 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(300 512 512)"/>
    <line x1="512" y1="246" x2="512" y2="288" stroke-width="14" transform="rotate(330 512 512)"/>
  </g>

  <!-- Hour hand (pointing at 10) and minute hand (pointing at 2). -->
  <g stroke="#ffffff" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="372" stroke-width="40" transform="rotate(-60 512 512)"/>
    <line x1="512" y1="512" x2="512" y2="298" stroke-width="30" transform="rotate(60 512 512)"/>
  </g>

  <!-- Second hand and centre dot, in the same red as the "timer finished" colour. -->
  <line x1="512" y1="560" x2="512" y2="262" stroke="#ff5f56" stroke-width="12" stroke-linecap="round" transform="rotate(150 512 512)"/>
  <circle cx="512" cy="512" r="26" fill="#ff5f56"/>
  <circle cx="512" cy="512" r="10" fill="#0d0d0f"/>
</svg>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Only the display for the current mode is visible. -->
    <div class="display" id="time" data-mode="clock">--:--:--</div>
    <div class="display" id="timer-display" data-mode="timer">25:00</div>
    <div class="display" id="stopwatch-display" data-mode="stopwatch">00:00.0</div>

    <div class="row">
      <button id="mode-button" title="Switch between clock, timer, and stopwatch">Clock</button>

      <span class="controls" data-mode="timer">
        <button id="timer-minus" title="One minute less">−</button>
        <button id="timer-plus" title="One minute more">+</button>
        <button id="timer-toggle" title="Start">▶</button>
        <button id="timer-reset" title="Reset">↺</button>
      </span>

      <span class="controls" data-mode="stopwatch">
        <button id="stopwatch-toggle" title="Start">▶</button>
        <button id="stopwatch-reset" title="Reset">↺</button>
      </span>

      <button id="opacity-button" title="Opacity: 100%. Click for less.">◐</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>

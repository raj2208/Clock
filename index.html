<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'"
    />
    <title>Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="time">--:--:--</div>

    <div class="row" id="timer">
      <button id="timer-minus" title="One minute less">−</button>
      <span id="timer-display">25:00</span>
      <button id="timer-plus" title="One minute more">+</button>
      <button id="timer-start">Start</button>
    </div>

    <div class="row" id="stopwatch">
      <span id="stopwatch-display">00:00.0</span>
      <button id="stopwatch-start">Start</button>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
